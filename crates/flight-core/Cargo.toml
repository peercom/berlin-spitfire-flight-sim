[package]
name = "flight-core"
version = "0.1.0"
edition = "2024"
description = "Deterministic Spitfire Mk IX browser flight dynamics"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.128"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
